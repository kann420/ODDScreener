<svg width="24" height="24" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>
  
  <!-- Dark circle background -->
  <circle cx="50" cy="50" r="48" fill="#1a1a1a"/>
  
  <!-- White vertical stripes -->
  <g clip-path="url(#circleClip)">
    <rect x="12" y="10" width="7" height="80" fill="white" rx="2"/>
    <rect x="26" y="10" width="7" height="80" fill="white" rx="2"/>
    <rect x="40" y="10" width="7" height="80" fill="white" rx="2"/>
    <rect x="54" y="10" width="7" height="80" fill="white" rx="2"/>
    <rect x="68" y="10" width="7" height="80" fill="white" rx="2"/>
    <rect x="82" y="10" width="7" height="80" fill="white" rx="2"/>
  </g>
</svg>
